version: '3.8'

services:
  # PHP API Service
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: authnexora-api
    container_name: authnexora-api
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: api
      SERVICE_TAGS: dev
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: authnexora
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
    volumes:
      - ./api:/var/www
    networks:
      - authnexora-network

  # Nginx Web Server Service
  web:
    image: nginx:alpine
    container_name: authnexora-web
    restart: unless-stopped
    tty: true
    ports:
      - "8080:80"
    volumes:
      - ./api:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - authnexora-network
    depends_on:
      - api

  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: authnexora-db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: authnexora
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_PASSWORD: rootpassword
    volumes:
      - authnexora-db-data:/var/lib/mysql
      - ./api/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - authnexora-network

  # phpMyAdmin for Database Management
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: authnexora-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    networks:
      - authnexora-network
    depends_on:
      - db

networks:
  authnexora-network:
    driver: bridge

volumes:
  authnexora-db-data:
    driver: local
