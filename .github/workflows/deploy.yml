name: 🚀 Build & Deploy PHP API

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    name: 🛠️ Build + 📤 Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar repositório
      - name: 📥 Clonar repositório
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      # 2. Configurar PHP
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          tools: composer:v2

      # 3. Cache do Composer (deixa MUITO mais rápido)
      - name: ⚡ Cache Composer
        uses: actions/cache@v3
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      # 4. Detectar alteração de dependências (composer.json / composer.lock)
      - name: 🔎 Detectar mudanças de dependências
        id: deps
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            if git diff --name-only HEAD^ HEAD | grep -E '^api/(composer\.json|composer\.lock)$' >/dev/null; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # Primeiro commit visível no checkout: faz deploy completo por segurança
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 5. Instalar dependências só quando dependências mudarem
      - name: 📦 Instalar dependências (Composer)
        if: steps.deps.outputs.changed == 'true'
        working-directory: ./api
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction --no-progress

      # 6. Criar arquivo .env a partir do Secret
      - name: 🔐 Criar arquivo .env
        working-directory: ./api
        run: echo "${{ secrets.ENV_FILE }}" > .env

      # 6. Deploy via FTP (com vendor)
      - name: 🚀 Deploy via FTP
      # 7A. Deploy completo (inclui vendor) quando dependências mudam
      - name: 🚀 Deploy via FTP (com vendor)
        if: steps.deps.outputs.changed == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./api/
          server-dir: /htdocs/
          # Evita apagar tudo no servidor e reduz tempo de deploy
          dangerous-clean-slate: false
          exclude: ".git*\n.github*\nnode_modules/**\n.well-known/**\n.env\n.ftp-deploy-sync-state.json"
