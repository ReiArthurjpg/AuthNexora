<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redefinir senha</title>
</head>
<body style="margin: 0; padding: 0; background-color: #070708; font-family: 'Inter', Helvetica, Arial, sans-serif; color: #ffffff; -webkit-font-smoothing: antialiased;">
  <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #070708; min-height: 100vh; padding: 40px 20px;">
    <tr>
      <td align="center" valign="top">
        <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; background-color: #0F0F11; border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 8px; overflow: hidden;">
          
          <!-- Header -->
          <tr>
            <td align="center" style="padding: 40px 30px; border-bottom: 1px solid rgba(255, 255, 255, 0.05);">
              <h1 style="margin: 0; font-size: 32px; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -1px; color: #ffffff;">
                NEXORA <span style="color: #E11D48;">BJJ</span>
              </h1>
            </td>
          </tr>

          <!-- Content -->
          <tr>
            <td style="padding: 40px 30px;">
              <h2 style="margin: 0 0 30px; font-size: 36px; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -1px; color: #ffffff; text-align: center;">
                TROCA DE <span style="color: #E11D48;">SENHA</span>
              </h2>
              
              <p style="margin: 0 0 20px; font-size: 18px; color: #a1a1aa; line-height: 1.6; font-weight: bold; text-align: center;">
                Olá, {{name}}!
              </p>
              
              <p style="margin: 0 0 40px; font-size: 18px; color: #a1a1aa; line-height: 1.6; font-weight: bold; text-align: center;">
                Recebemos uma solicitação para redefinir sua senha.
              </p>
              
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td align="center" style="padding-bottom: 30px;">
                    <a href="{{reset_link}}" style="display: inline-block; padding: 20px 40px; background-color: #E11D48; color: #ffffff; text-decoration: none; border-radius: 6px; font-size: 18px; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -1px; text-align: center; box-shadow: 0 10px 25px -5px rgba(225, 29, 72, 0.1);">
                      REDEFINIR MINHA SENHA
                    </a>
                  </td>
                </tr>
              </table>

              <p style="margin: 0 0 15px; font-size: 14px; color: #71717a; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; text-align: center;">
                Este link expira em 30 minutos.
              </p>
              
              <p style="margin: 0; font-size: 14px; color: #71717a; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; text-align: center;">
                Se você não solicitou, ignore este e-mail com segurança.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding: 24px 30px; background-color: #070708; border-top: 1px solid rgba(255, 255, 255, 0.05);">
              <p style="margin: 0; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: rgba(255, 255, 255, 0.3);">
                &copy; NEXORA BJJ. TODOS OS DIREITOS RESERVADOS.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
